name: Hourly Health Ping

on:
  schedule:
    # Runs every 60 minutes
    - cron: '0 * * * *'
  workflow_dispatch:

concurrency:
  group: hourly-health-ping
  cancel-in-progress: true

jobs:
  ping:
    name: Fast Uptime and Health Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Verify TypeScript Compilation
        run: npm run build

      - name: Run Hourly Health Ping
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          ROBLOX_OPENCLOUD_KEY: ${{ secrets.ROBLOX_OPENCLOUD_KEY }}
          ROBLOX_UNIVERSE_ID: ${{ secrets.ROBLOX_UNIVERSE_ID }}
          MONITORED_URLS: ${{ secrets.MONITORED_URLS }}
          ENABLE_MOCK: ${{ secrets.ENABLE_MOCK || 'false' }}
        run: npm run health
