name: Weekly Growth Audit

on:
  schedule:
    # Runs Sunday at midnight UTC (00:00 UTC)
    - cron: '0 0 * * 0'
  workflow_dispatch:

concurrency:
  group: weekly-growth-audit
  cancel-in-progress: false

jobs:
  audit:
    name: Execute Full LLM Growth Audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Verify TypeScript Compilation
        run: npm run build

      - name: Run Strategic Growth Audit Pipeline
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_PROVIDER: ${{ secrets.LLM_PROVIDER || 'gemini' }}
          LLM_MODEL: ${{ secrets.LLM_MODEL || 'gemini-1.5-flash' }}
          ROBLOX_OPENCLOUD_KEY: ${{ secrets.ROBLOX_OPENCLOUD_KEY }}
          ROBLOX_UNIVERSE_ID: ${{ secrets.ROBLOX_UNIVERSE_ID }}
          MONITORED_URLS: ${{ secrets.MONITORED_URLS }}
          ENABLE_MOCK: ${{ secrets.ENABLE_MOCK || 'false' }}
          SEARCH_CONSOLE_ENABLED: ${{ secrets.SEARCH_CONSOLE_ENABLED || 'false' }}
        run: npm run audit
